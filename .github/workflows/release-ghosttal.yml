name: Release Ghosttal

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z; tag vX.Y.Z must exist)"
        required: true
      repair_appcast:
        description: "Publish the appcast from an existing release artifact"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghosttal-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_appcast }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve and check release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: ${VERSION}" >&2; exit 1; }
          git fetch origin main --force "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "v${VERSION}"
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag v${VERSION} is not contained in origin/main." >&2
            exit 1
          }
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf zig.tar.xz -C "${RUNNER_TEMP}/zig" --strip-components 1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"

      - name: Install Nushell 0.115.1
        run: |
          curl -fsSL -o nu.tar.gz https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-aarch64-apple-darwin.tar.gz
          echo "2e6ed1eb043869ff05b5f2448a8c443e4d3a93557ba4303b21008a0523c96734  nu.tar.gz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/nu"
          tar -xzf nu.tar.gz -C "${RUNNER_TEMP}/nu" --strip-components 1
          echo "${RUNNER_TEMP}/nu" >> "${GITHUB_PATH}"

      - name: Verify source
        run: |
          bash -n scripts/*.sh
          zig fmt --check .
          zig build test
          zig build -Demit-macos-app=false
          ./macos/build.nu --scheme Ghostty --configuration Debug --action test

  release:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then VERSION="${INPUT_VERSION}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: ${VERSION}" >&2; exit 1; }
          git fetch origin main --force "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "v${VERSION}"
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag is not contained in origin/main." >&2; exit 1; }
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned build tools
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf zig.tar.xz -C "${RUNNER_TEMP}/zig" --strip-components 1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"

          curl -fsSL -o nu.tar.gz https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-aarch64-apple-darwin.tar.gz
          echo "2e6ed1eb043869ff05b5f2448a8c443e4d3a93557ba4303b21008a0523c96734  nu.tar.gz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/nu"
          tar -xzf nu.tar.gz -C "${RUNNER_TEMP}/nu" --strip-components 1
          echo "${RUNNER_TEMP}/nu" >> "${GITHUB_PATH}"

          curl -fsSL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz
          echo "01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/sparkle"
          tar -xJf sparkle.tar.xz -C "${RUNNER_TEMP}/sparkle"
          echo "SPARKLE_BIN=${RUNNER_TEMP}/sparkle/bin" >> "${GITHUB_ENV}"

          curl -fsSL -o create-dmg.tar.gz https://github.com/create-dmg/create-dmg/archive/a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f.tar.gz
          echo "36577b966f16c12dd78d5bb5107c2ae3d069b044226b6ebbffa6a434ce142d0a  create-dmg.tar.gz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/create-dmg"
          tar -xzf create-dmg.tar.gz -C "${RUNNER_TEMP}/create-dmg" --strip-components 1
          chmod +x "${RUNNER_TEMP}/create-dmg/create-dmg"
          echo "CREATE_DMG=${RUNNER_TEMP}/create-dmg/create-dmg" >> "${GITHUB_ENV}"
          rm -f zig.tar.xz nu.tar.gz sparkle.tar.xz create-dmg.tar.gz

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db

      - name: Write notary and Sparkle keys
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "${ASC_API_KEY_P8}" > "${RUNNER_TEMP}/asc-key.p8"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${RUNNER_TEMP}/sparkle-key"
          chmod 600 "${RUNNER_TEMP}/asc-key.p8" "${RUNNER_TEMP}/sparkle-key"
          echo "NOTARY_KEY_FILE=${RUNNER_TEMP}/asc-key.p8" >> "${GITHUB_ENV}"
          echo "SPARKLE_KEY_FILE=${RUNNER_TEMP}/sparkle-key" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: ./scripts/release-macos.sh

      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/Ghosttal-${RELEASE_VERSION}-universal.dmg"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            mkdir -p "${RUNNER_TEMP}/existing-release"
            gh release download "v${RELEASE_VERSION}" -p "$(basename "${DMG}")" -D "${RUNNER_TEMP}/existing-release"
            cmp "${DMG}" "${RUNNER_TEMP}/existing-release/$(basename "${DMG}")" || {
              echo "Existing release asset differs; refusing to overwrite it." >&2
              exit 1
            }
            gh release upload "v${RELEASE_VERSION}" dist/SHA256SUMS --clobber
          else
            NOTES="$(awk -v version="${RELEASE_VERSION}" '$0 == "## " version {on=1; next} /^## / && on {exit} on' CHANGELOG.md)"
            gh release create "v${RELEASE_VERSION}" "${DMG}" dist/SHA256SUMS \
              --title "Ghosttal ${RELEASE_VERSION}" --notes "${NOTES:-See CHANGELOG.md.}" --verify-tag
          fi

      - name: Publish monotonic appcast
        run: |
          cp appcast.xml "${RUNNER_TEMP}/appcast.xml"
          git fetch origin main
          CURRENT_VERSION="$(git show origin/main:appcast.xml | sed -n 's|.*<sparkle:version>\([^<]*\)</sparkle:version>.*|\1|p' | head -1)"
          git checkout -B main origin/main
          if [[ "${CURRENT_VERSION}" == "${RELEASE_VERSION}" ]]; then
            echo "Appcast already publishes ${RELEASE_VERSION}."
            exit 0
          fi
          ruby -r rubygems -e 'exit(Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1]) ? 0 : 1)' "${RELEASE_VERSION}" "${CURRENT_VERSION}" || {
            echo "Refusing to replace newer appcast ${CURRENT_VERSION} with ${RELEASE_VERSION}." >&2
            exit 1
          }
          cp "${RUNNER_TEMP}/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && { echo "Appcast is unchanged."; exit 0; }
          git commit -m "release: publish appcast for v${RELEASE_VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin main && exit 0
            [[ "${attempt}" == 3 ]] && exit 1
            sleep 5
          done

      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/release.keychain-db" || true
          rm -f "${RUNNER_TEMP}/asc-key.p8" "${RUNNER_TEMP}/sparkle-key" "${RUNNER_TEMP}/cert.p12"

  repair-appcast:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_appcast }}
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve and check published release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: ${INPUT_VERSION}" >&2; exit 1; }
          git fetch origin main --force "refs/tags/v${INPUT_VERSION}:refs/tags/v${INPUT_VERSION}"
          git merge-base --is-ancestor "v${INPUT_VERSION}^{commit}" origin/main || {
            echo "Release tag v${INPUT_VERSION} is not contained in origin/main." >&2
            exit 1
          }
          gh release view "v${INPUT_VERSION}" >/dev/null
          echo "RELEASE_VERSION=${INPUT_VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned Sparkle tools
        run: |
          curl -fsSL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz
          echo "01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/sparkle"
          tar -xJf sparkle.tar.xz -C "${RUNNER_TEMP}/sparkle"
          echo "SPARKLE_BIN=${RUNNER_TEMP}/sparkle/bin" >> "${GITHUB_ENV}"
          rm -f sparkle.tar.xz

      - name: Sign published artifact and generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist
          gh release download "v${RELEASE_VERSION}" -p "Ghosttal-${RELEASE_VERSION}-universal.dmg" -p SHA256SUMS -D dist
          (cd dist && shasum -a 256 -c SHA256SUMS)
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${RUNNER_TEMP}/sparkle-key"
          chmod 600 "${RUNNER_TEMP}/sparkle-key"
          ED_ATTRIBUTES="$("${SPARKLE_BIN}/sign_update" --ed-key-file "${RUNNER_TEMP}/sparkle-key" "dist/Ghosttal-${RELEASE_VERSION}-universal.dmg")"
          [[ "${ED_ATTRIBUTES}" == *sparkle:edSignature=* ]] || { echo "Sparkle signature was not produced." >&2; exit 1; }
          cat > appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Ghosttal</title>
              <link>https://github.com/ccyisafool/ghosttal</link>
              <description>Ghosttal update feed</description>
              <language>en</language>
              <item>
                <title>Ghosttal ${RELEASE_VERSION}</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${RELEASE_VERSION}</sparkle:version>
                <sparkle:shortVersionString>${RELEASE_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/ccyisafool/ghosttal/releases/tag/v${RELEASE_VERSION}</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/ccyisafool/ghosttal/releases/download/v${RELEASE_VERSION}/Ghosttal-${RELEASE_VERSION}-universal.dmg" ${ED_ATTRIBUTES} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          APPCAST

      - name: Publish monotonic appcast
        run: |
          cp appcast.xml "${RUNNER_TEMP}/appcast.xml"
          git fetch origin main
          CURRENT_VERSION="$(git show origin/main:appcast.xml | sed -n 's|.*<sparkle:version>\([^<]*\)</sparkle:version>.*|\1|p' | head -1)"
          if [[ "${CURRENT_VERSION}" == "${RELEASE_VERSION}" ]]; then
            echo "Appcast already publishes ${RELEASE_VERSION}."
            exit 0
          fi
          ruby -r rubygems -e 'exit(Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1]) ? 0 : 1)' "${RELEASE_VERSION}" "${CURRENT_VERSION}" || {
            echo "Refusing to replace newer appcast ${CURRENT_VERSION} with ${RELEASE_VERSION}." >&2
            exit 1
          }
          git checkout -B main origin/main
          cp "${RUNNER_TEMP}/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && { echo "Appcast is unchanged."; exit 0; }
          git commit -m "release: publish appcast for v${RELEASE_VERSION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin main && exit 0
            [[ "${attempt}" == 3 ]] && exit 1
            sleep 5
          done

      - name: Clean up Sparkle key
        if: always()
        run: rm -f "${RUNNER_TEMP}/sparkle-key"
